<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#07111f">
  <title>Prism Breaker</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="game-shell">
    <header>
      <div class="brand"><span>PRISM</span> BREAKER</div>
      <div class="actions">
        <button id="soundButton" class="icon-button" aria-label="サウンドをオフにする">♪</button>
        <button id="pauseButton" class="icon-button" aria-label="一時停止">Ⅱ</button>
      </div>
    </header>

    <section class="hud" aria-label="ゲーム情報">
      <div><small>SCORE</small><strong id="score">000000</strong></div>
      <div><small>STAGE</small><strong id="stage">01</strong></div>
      <div><small>LIVES</small><strong id="lives" aria-label="残機3">● ● ●</strong></div>
    </section>

    <section id="arena" class="arena">
      <canvas id="gameCanvas" aria-label="ブロック崩しゲーム画面"></canvas>
      <div id="message" class="message show">
        <p id="eyebrow">TOUCH TO LAUNCH</p>
        <h1 id="messageTitle">PRISM<br>BREAKER</h1>
        <p id="messageText">指で左右になぞって<br>光のパドルを操ろう</p>
        <button id="startButton" class="primary">ゲームスタート</button>
      </div>
      <div id="toast" class="toast" aria-live="polite"></div>
    </section>

    <footer>
      <p><span class="touch-icon">↔</span> 画面を左右になぞって操作</p>
      <button id="restartButton">↻ リスタート</button>
    </footer>
  </main>
  <script src="./game.js"></script>
</body>
</html>
